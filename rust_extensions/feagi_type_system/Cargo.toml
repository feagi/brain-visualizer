[package]
name = "feagi_type_system"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
description = "FEAGI Cortical Type System GDExtension - Exposes feagi-data-processing types to Godot"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Godot 4 bindings
godot = { version = "0.5.5", features = ["serde", "api-4-7"] }

# FEAGI core dependencies (crates.io; unified feagi-core release line)
feagi-structures = { version = "^0.0.24" }
feagi-sensorimotor = { version = "^0.0.24" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"

[profile.dev]
opt-level = 1  # Faster dev builds

[profile.release]
opt-level = 3
lto = true
strip = true

