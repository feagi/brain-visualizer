[package]
name = "feagi_data_deserializer"
version = "0.1.4"
edition = "2021"

[dependencies]
# Godot Rust bindings
godot = { version = "0.5.5", features = ["experimental-wasm", "lazy-function-tables", "api-4-7"] }

# FEAGI data serialization (crates.io; unified feagi-core release line)
feagi-serialization = { version = "^0.0.31" }
feagi-structures = { version = "^0.0.31" }
feagi-sensorimotor = { version = "^0.0.31" }

# Additional dependencies for data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lz4 = "1.28"  # LZ4 decompression for FEAGI visualization stream (matches PNS compression)
base64 = "0.22"  # For decoding base64-encoded cortical IDs

# Parallel processing for high-performance neuron visualization (desktop only)
# Note: Rayon doesn't work in WASM, so we use conditional compilation
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "1.8"

[lib]
crate-type = ["cdylib"]

[profile.release]
# Optimize for performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Faster compilation for development
opt-level = 0
debug = true