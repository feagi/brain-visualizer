[package]
name = "feagi_agent_client"
version = "0.1.4"
edition = "2021"
description = "FEAGI agent registration client GDExtension - uses feagi-agent SDK for standard registration and session/byte-container handling"

[dependencies]
godot = { version = "0.5.5", features = ["experimental-wasm", "lazy-function-tables", "api-4-7"] }

# FEAGI agent SDK (crates.io; unified feagi-core release line)
feagi-agent = { version = "^0.0.24", default-features = false, features = ["agent-client", "agent-transport-websocket-std"] }
feagi-serialization = { version = "^0.0.24" }
feagi-io = { version = "^0.0.24", default-features = false, features = ["feagi-client", "websocket-transport-std"] }
base64 = "0.22"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
