[package]
name = "feagi_agent_client"
version = "0.1.4"
edition = "2021"
description = "FEAGI agent registration client GDExtension - uses feagi-agent SDK for standard registration and session/byte-container handling"

[dependencies]
godot = { version = "0.5.5", features = ["experimental-wasm", "lazy-function-tables", "api-4-7"] }

# FEAGI agent SDK (crates.io; unified feagi-core release line)
feagi-agent = { version = "^0.0.35", default-features = false, features = ["agent-client", "agent-transport-websocket-std"] }
feagi-serialization = { version = "^0.0.35" }
feagi-io = { version = "^0.0.35", default-features = false, features = ["feagi-client", "websocket-transport-std"] }
base64 = "0.22"

# Heartbeat/session integration tests run a real FEAGI agent server of a newer feagi-core release
# (renamed so it can sit next to the 0.0.35 client SDK above). Test-only; never part of the extension.
[dev-dependencies]
feagi-agent-server = { package = "feagi-agent", version = "=0.0.56", default-features = false, features = ["agent-server", "agent-transport-websocket-std"] }
feagi-io-server = { package = "feagi-io", version = "=0.0.56", default-features = false, features = ["feagi-server", "websocket-transport-std"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
